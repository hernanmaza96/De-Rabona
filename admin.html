<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | De Rabona</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .preview-box { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; background-color: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: var(--radius-md); border: 2px dashed var(--border-color); min-height: 60px; width: 100%; box-sizing: border-box; }
        .preview-box img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius-sm); border: 2px solid var(--brand-blue); box-shadow: var(--shadow-sm); }
        .preview-box .txt-existing { font-size: 12px; color: var(--brand-blue); width: 100%; margin-bottom: 5px; font-weight: 700; }

        .checkbox-group { display: flex; align-items: center; gap: 12px; background-color: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color); cursor: pointer; margin-bottom: 0; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .checkbox-group:hover { border-color: var(--brand-gold); }
        .checkbox-group input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--brand-gold); cursor: pointer; margin: 0; }

        .inline-stock-input { width: 45px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #FFFFFF; text-align: center; border-radius: 6px; padding: 6px; font-size: 13px; font-weight: 600; transition: 0.2s;}
        .inline-stock-input:focus { border-color: var(--brand-blue); outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); background: rgba(255, 255, 255, 0.1); }

        /* ACORDEÓN TABLA */
        .accordion-header-row { background-color: rgba(255, 255, 255, 0.03); cursor: pointer; transition: background 0.2s; }
        .accordion-header-row:hover { background-color: rgba(255, 255, 255, 0.06); }
        .accordion-header-cell { padding: 15px !important; border-bottom: 2px solid var(--border-color) !important; }
        .accordion-icon { transition: transform 0.3s; display: inline-block; width: 20px; color: var(--brand-blue); }
        .product-row { background-color: var(--bg-card) !important; display: none; }
        .product-row td { border-bottom: 1px solid var(--border-color) !important; color: #FFFFFF; }

        /* TOASTS & CONFIRM */
        .custom-toast-container { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .custom-toast { background-color: var(--bg-card); color: var(--text-main); padding: 16px 24px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); border-left: 4px solid var(--brand-blue); display: flex; align-items: center; gap: 12px; animation: slideDown 0.3s ease-out forwards; pointer-events: auto; max-width: 90vw; width: max-content; }
        .custom-toast.error { border-left-color: var(--brand-red); }
        .custom-toast.success { border-left-color: var(--brand-green); }
        .custom-toast.warning { border-left-color: var(--brand-gold); }
        .custom-toast i { font-size: 18px; }
        .custom-toast.error i { color: var(--brand-red); }
        .custom-toast.success i { color: var(--brand-green); }
        .custom-toast.warning i { color: var(--brand-gold); }
        .custom-toast.info i { color: var(--brand-blue); }
        @keyframes slideDown { from { top: -60px; opacity: 0; } to { top: 24px; opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        .custom-confirm-overlay { position: fixed; inset: 0; background: rgba(9, 13, 22, 0.8); backdrop-filter: blur(6px); z-index: 1000000; display: none; justify-content: center; align-items: center; }
        .custom-confirm-overlay.active { display: flex; }
        .custom-confirm-box { background: var(--bg-card); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); text-align: center; max-width: 400px; width: 90%; border: 1px solid var(--border-color); }
        .custom-confirm-box h3 { font-size: 24px; margin-bottom: 15px; color: #FFFFFF; font-family: 'Oswald', sans-serif; }
        .custom-confirm-box p { font-size: 15px; color: var(--text-muted); margin-bottom: 25px; }
        .custom-confirm-actions { display: flex; gap: 12px; justify-content: center; }
        .custom-confirm-actions button { padding: 12px 20px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; flex: 1; font-size: 14px; transition: 0.2s; }
        .btn-cancel { background: rgba(255, 255, 255, 0.05); color: #FFFFFF; border: 1px solid var(--border-color); }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-accept { background: var(--brand-red); color: white; }
        .btn-accept:hover { background: #DC2626; }

        /* AJUSTES DE SELECTS Y LISTAS DESPLEGABLES */
        select option { background-color: #0F172A; color: #FFFFFF; }

        @media (max-width: 768px) {
            body, html { width: 100%; overflow-x: hidden; }
            .header-container { flex-direction: row; justify-content: space-between; padding: 10px 15px; height: auto; }
            .header-actions-admin { width: auto; }
            .header-actions-admin button { width: auto !important; padding: 10px 15px !important; font-size: 14px !important; }
            
            .admin-panel { margin: 15px auto !important; padding: 20px 15px !important; width: 94% !important; max-width: 100% !important; box-sizing: border-box; }
            .form-grid { display: flex !important; flex-direction: column !important; gap: 15px !important; }
            .form-group { width: 100% !important; grid-column: auto !important; box-sizing: border-box; }
            .form-group input, .form-group select, .form-group textarea { width: 100% !important; box-sizing: border-box; }
            .stock-grid-box { width: 100% !important; grid-column: auto !important; box-sizing: border-box; }
            .stock-flex { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 10px !important; }
            .stock-flex div { width: 100%; }
            .stock-flex input { width: 100% !important; text-align: center; box-sizing: border-box; }
            .admin-actions { display: flex !important; flex-direction: column !important; gap: 10px !important; width: 100% !important; grid-column: auto !important; }
            .admin-actions button { width: 100% !important; justify-content: center !important; }
            .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; display: block; }
            .admin-table { min-width: 700px; }
            .admin-header { flex-direction: column; align-items: stretch; gap: 15px; }
            .admin-header button { width: 100%; }
        }
    </style>
</head>
<body>

    <header class="main-header" style="transform: translateY(0) !important;">
        <div class="header-container">
            <div class="logo-brand">
                <img src="logo.jpg" alt="De Rabona" class="logo-img">
                <div>
                    <div class="brand-text-title">DE RABONA</div>
                    <div class="brand-text-sub" style="color: var(--brand-blue);">Admin Panel</div>
                </div>
            </div>
            <div class="header-actions-admin">
                <button type="button" onclick="window.location.href='./index.html';" class="btn-cart">
                    <i class="fa-solid fa-store"></i> Ir a la Tienda
                </button>
            </div>
        </div>
    </header>

    <div id="loginScreen" class="admin-panel" style="max-width: 420px; text-align: center; margin-top: 10vh;">
        <h2 class="font-display" style="font-size: 36px; margin-bottom: 10px; color: #FFFFFF;">Ingreso Privado</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Solo para administradores de De Rabona.</p>
        <div class="form-group">
            <input type="password" id="adminPass" placeholder="Contraseña...">
        </div>
        <button onclick="intentarLogin()" class="btn-add" style="width: 100%; justify-content: center; margin-top: 20px; padding: 14px; font-size: 16px;">Ingresar</button>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
        <div class="admin-header">
            <div>
                <h2 class="font-display" style="font-size: 28px; font-weight: 700; color: #FFFFFF;">Gestión de Inventario</h2>
                <p style="font-size: 14px; color: var(--text-muted);">Subí fotos, actualizá precios y controlá el stock.</p>
            </div>
            <button onclick="cerrarSesion()" class="btn-delete" style="padding: 10px 20px; border-radius: var(--radius-md); font-weight: 600;">Cerrar Sesión</button>
        </div>

        <form id="productForm" onsubmit="guardarProducto(event)" class="form-grid">
            <input type="hidden" id="productId">
            <input type="hidden" id="pImageUrlCurrent">

            <div class="form-group">
                <label>Nombre de la Prenda *</label>
                <input type="text" id="pTitle" required placeholder="Ej: River Titular 1996">
            </div>
            
            <div class="form-group">
                <label>Equipo / Selección *</label>
                <select id="pTeamSelect" onchange="handleTeamSelectChange()" required>
                    <option value="">-- Seleccionar Equipo --</option>
                    <option value="NUEVO" style="color: var(--brand-blue); font-weight: bold;">+ Crear Nuevo Equipo</option>
                </select>
                <input type="text" id="pTeamNew" placeholder="Escribí el nombre del nuevo equipo..." style="display: none; margin-top: 8px;" required>
            </div>

            <div class="form-group">
                <label>Tipo de Prenda *</label>
                <select id="pProductType" required>
                    <option value="Camiseta">Camiseta de Fútbol</option>
                    <option value="Conjunto (Short)">Conjunto (Short)</option>
                    <option value="Buzo / Jogging">Buzo / Jogging</option>
                    <option value="Remera Manga Larga">Remera Manga Larga</option>
                    <option value="Campera">Campera</option>
                    <option value="Pantalón">Pantalón</option>
                    <option value="Accesorio">Accesorio</option>
                </select>
            </div>

            <div class="form-group">
                <label>Precio ($ ARS) *</label>
                <input type="number" id="pPrice" min="0" required placeholder="45000">
            </div>

            <div class="form-group">
                <label>Opciones Especiales</label>
                <label class="checkbox-group" for="pIsRetro">
                    <input type="checkbox" id="pIsRetro">
                    <span style="font-size: 14px; font-weight: 700; color: var(--brand-gold);">⭐ Es Retro / Clásica</span>
                </label>
            </div>
            
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Fotos (Múltiples)</label>
                <input type="file" id="pImageFile" accept="image/*" multiple onchange="previsualizarFotos()" style="background: rgba(255,255,255,0.03); padding: 10px; margin-bottom: 5px;">
                <div id="previewContainer" class="preview-box">
                    <span style="color: var(--text-muted); font-size: 13px;">Las fotos seleccionadas aparecerán acá...</span>
                </div>
            </div>

            <div class="stock-grid-box">
                <label style="font-size: 14px; font-weight: 700; color: #FFFFFF; margin-bottom: 10px; display: block;">CONTROL DE STOCK</label>
                <div class="stock-flex">
                    <div><label style="font-size: 12px; font-weight: 600; display:block; text-align:center; color: var(--text-muted); margin-bottom: 5px;">S</label><input type="number" id="stockS" min="0" value="0"></div>
                    <div><label style="font-size: 12px; font-weight: 600; display:block; text-align:center; color: var(--text-muted); margin-bottom: 5px;">M</label><input type="number" id="stockM" min="0" value="0"></div>
                    <div><label style="font-size: 12px; font-weight: 600; display:block; text-align:center; color: var(--text-muted); margin-bottom: 5px;">L</label><input type="number" id="stockL" min="0" value="0"></div>
                    <div><label style="font-size: 12px; font-weight: 600; display:block; text-align:center; color: var(--text-muted); margin-bottom: 5px;">XL</label><input type="number" id="stockXL" min="0" value="0"></div>
                    <div><label style="font-size: 12px; font-weight: 600; display:block; text-align:center; color: var(--text-muted); margin-bottom: 5px;">XXL</label><input type="number" id="stockXXL" min="0" value="0"></div>
                </div>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Descripción (Opcional)</label>
                <textarea id="pDesc" rows="3"></textarea>
            </div>

            <div class="admin-actions">
                <button type="button" onclick="limpiarFormulario()" class="btn-cancel" style="padding: 14px 24px; font-size: 15px; border-radius: var(--radius-md);">Limpiar</button>
                <button type="submit" id="saveBtn" class="btn-add" style="padding: 14px 24px; font-size: 15px;"><i class="fa-solid fa-cloud-arrow-up"></i> Guardar en la Nube</button>
            </div>
        </form>

        <hr style="border-color: var(--border-color); margin: 40px 0; border-width: 1px;">
        <h3 class="font-display" style="margin-bottom: 15px; font-size: 24px; color: #FFFFFF;">Productos en la Nube <span style="font-size:15px; color:var(--text-muted); font-family: 'Inter', sans-serif; font-weight:500; text-transform: none; letter-spacing: 0;">(Tocá un equipo para abrir/cerrar)</span></h3>
        <div class="table-responsive">
            <table class="admin-table">
                <thead>
                    <tr><th>Fotos</th><th>Prenda</th><th>Precio</th><th>Stock (Editable)</th><th>Acciones</th></tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // --- SISTEMA DE NOTIFICACIONES ---
        function showToast(message, type = 'info') {
            let container = document.getElementById('toastContainer');
            if(!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'custom-toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            let icon = 'fa-circle-info';
            if(type === 'error') icon = 'fa-circle-exclamation';
            if(type === 'success') icon = 'fa-circle-check';
            if(type === 'warning') icon = 'fa-triangle-exclamation';
            
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- SISTEMA DE CONFIRMACIÓN ---
        function customConfirm(message) {
            return new Promise((resolve) => {
                let overlay = document.getElementById('customConfirm');
                if(!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'customConfirm';
                    overlay.className = 'custom-confirm-overlay';
                    overlay.innerHTML = `
                        <div class="custom-confirm-box">
                            <h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--brand-gold);"></i> Atención</h3>
                            <p id="confirmMsg"></p>
                            <div class="custom-confirm-actions">
                                <button class="btn-cancel" id="btnConfirmCancel">Cancelar</button>
                                <button class="btn-accept" id="btnConfirmAccept">Aceptar</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                }
                document.getElementById('confirmMsg').innerText = message;
                overlay.classList.add('active');

                const btnCancel = document.getElementById('btnConfirmCancel');
                const btnAccept = document.getElementById('btnConfirmAccept');

                const cleanup = () => {
                    overlay.classList.remove('active');
                    btnCancel.onclick = null;
                    btnAccept.onclick = null;
                };

                btnCancel.onclick = () => { cleanup(); resolve(false); };
                btnAccept.onclick = () => { cleanup(); resolve(true); };
            });
        }

        // --- LÓGICA DEL ADMIN ---
        const ADMIN_PASS = "admin";
        const IMGBB_API_KEY = "82160906c59b0f96a89ce2af5fe4200b"; 

        // --- CONFIGURACIÓN NUEVA DE FIREBASE (DE RABONA) ---
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyChxdFfIs8xw-_79wFE6UFLttn2c2oo1bs",
                authDomain: "derabona.firebaseapp.com",
                projectId: "derabona",
                storageBucket: "derabona.firebasestorage.app",
                messagingSenderId: "1074994830029",
                appId: "1:1074994830029:web:9b96fa194eb368fd89a784"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
        } catch (e) {
            showToast("Error al conectar con Firebase", "error");
        }

        function handleTeamSelectChange() {
            const select = document.getElementById('pTeamSelect');
            const newInput = document.getElementById('pTeamNew');
            if (select.value === 'NUEVO') {
                newInput.style.display = 'block';
                newInput.required = true;
                newInput.focus();
            } else {
                newInput.style.display = 'none';
                newInput.required = false;
                newInput.value = '';
            }
        }

        function previsualizarFotos() {
            const files = document.getElementById("pImageFile").files;
            const preview = document.getElementById("previewContainer");
            preview.innerHTML = ""; 
            
            if (files.length > 0) {
                const txt = document.createElement("span");
                txt.className = "txt-existing";
                txt.innerText = `✅ ${files.length} foto(s) lista(s) para subir:`;
                preview.appendChild(txt);

                for (let i = 0; i < files.length; i++) {
                    const img = document.createElement("img");
                    img.src = URL.createObjectURL(files[i]);
                    preview.appendChild(img);
                }
            } else {
                preview.innerHTML = `<span style="color: var(--text-muted); font-size: 13px;">Las fotos seleccionadas aparecerán acá...</span>`;
            }
        }

        function intentarLogin() {
            const pass = document.getElementById("adminPass").value.trim();
            if (pass === ADMIN_PASS) {
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("adminPanel").classList.remove("hidden");
                cargarTablaProductos();
            } else {
                showToast("Contraseña incorrecta", "error");
            }
        }

        function cerrarSesion() {
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("adminPanel").classList.add("hidden");
            document.getElementById("adminPass").value = "";
        }

        // --- CARGA DE TABLA EN FORMATO ACORDEÓN ---
        function cargarTablaProductos() {
            const db = firebase.firestore();
            db.collection("products").onSnapshot((snapshot) => {
                const tbody = document.getElementById("adminTableBody");
                const teamSelect = document.getElementById("pTeamSelect");
                
                tbody.innerHTML = "";
                let currentProducts = [];
                let equiposUnicos = new Set();

                snapshot.forEach((doc) => {
                    const p = doc.data();
                    p.id = doc.id;
                    currentProducts.push(p);
                    if(p.team && p.team.trim() !== "") equiposUnicos.add(p.team.trim());
                });

                let selectedVal = teamSelect.value;
                teamSelect.innerHTML = `
                    <option value="">-- Seleccionar Equipo --</option>
                    <option value="NUEVO" style="color: var(--brand-blue); font-weight: bold;">+ Crear Nuevo Equipo</option>
                `;
                let equiposArray = Array.from(equiposUnicos).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
                equiposArray.forEach(eq => {
                    teamSelect.innerHTML += `<option value="${eq}">${eq}</option>`;
                });
                if(selectedVal && equiposArray.includes(selectedVal)) {
                    teamSelect.value = selectedVal;
                } else if (selectedVal === 'NUEVO') {
                    teamSelect.value = 'NUEVO';
                }

                if (currentProducts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px; color: var(--text-muted);">No hay productos cargados en la nube.</td></tr>`;
                    return;
                }

                let agrupados = {};
                currentProducts.forEach(p => {
                    let teamName = p.team ? p.team.trim() : "SIN EQUIPO";
                    if(!agrupados[teamName]) agrupados[teamName] = [];
                    agrupados[teamName].push(p);
                });

                let equiposOrdenados = Object.keys(agrupados).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));

                equiposOrdenados.forEach(team => {
                    const teamId = 'team_' + team.replace(/[^a-zA-Z0-9]/g, '');
                    const teamProducts = agrupados[team];

                    tbody.innerHTML += `
                        <tr class="accordion-header-row" onclick="toggleAccordion('${teamId}')">
                            <td colspan="5" class="accordion-header-cell">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: 16px; font-weight: 700; color: #FFFFFF;">
                                        <i class="fa-solid fa-chevron-right accordion-icon" id="icon_${teamId}"></i> 
                                        ${team} <span style="font-size: 13px; color: var(--text-muted); font-weight: 500;">(${teamProducts.length} prendas)</span>
                                    </span>
                                </div>
                            </td>
                        </tr>
                    `;

                    teamProducts.forEach(p => {
                        let fotosHTML = "";
                        let imagenes = p.images || (p.image ? [p.image] : ["logo.jpg"]);
                        
                        imagenes.forEach(img => {
                            fotosHTML += `<img src="${img}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); margin-right: 4px; margin-bottom: 4px;" onError="this.src='logo.jpg'">`;
                        });

                        let retroTag = p.isRetro ? `<br><span style="color: var(--brand-gold); font-size: 11px; font-weight:700;">⭐ RETRO</span>` : "";
                        let typeTag = p.productType ? `<br><span style="color: var(--brand-blue); font-size: 11px; font-weight:500;">${p.productType}</span>` : "";

                        tbody.innerHTML += `
                            <tr class="product-row" id="row_${teamId}">
                                <td style="display: flex; flex-wrap: wrap; gap: 2px; min-width: 100px;">${fotosHTML}</td>
                                <td style="min-width: 150px; color: #FFFFFF;"><strong>${p.title}</strong><small>${retroTag}${typeTag}</small></td>
                                <td style="min-width: 90px; color: #FFFFFF; font-weight:700; font-family: 'Oswald', sans-serif;">$${Number(p.price).toLocaleString('es-AR')}</td>
                                <td style="min-width: 180px; display: flex; gap: 6px; align-items: center; padding-top: 25px;">
                                    <input type="number" class="inline-stock-input" value="${p.stock?.S || 0}" title="S" onchange="updateStockInline('${p.id}', 'S', this.value)">
                                    <input type="number" class="inline-stock-input" value="${p.stock?.M || 0}" title="M" onchange="updateStockInline('${p.id}', 'M', this.value)">
                                    <input type="number" class="inline-stock-input" value="${p.stock?.L || 0}" title="L" onchange="updateStockInline('${p.id}', 'L', this.value)">
                                    <input type="number" class="inline-stock-input" value="${p.stock?.XL || 0}" title="XL" onchange="updateStockInline('${p.id}', 'XL', this.value)">
                                    <input type="number" class="inline-stock-input" value="${p.stock?.XXL || 0}" title="XXL" onchange="updateStockInline('${p.id}', 'XXL', this.value)">
                                </td>
                                <td style="min-width: 100px;">
                                    <button onclick="editarProducto('${p.id}')" class="btn-edit"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="eliminarProducto('${p.id}')" class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                });
            });
        }

        window.toggleAccordion = (teamId) => {
            const rows = document.querySelectorAll(`#row_${teamId}`);
            const icon = document.getElementById(`icon_${teamId}`);
            
            if(rows.length === 0) return;

            let isHidden = rows[0].style.display === 'none' || rows[0].style.display === '';
            
            rows.forEach(row => {
                row.style.display = isHidden ? 'table-row' : 'none';
            });
            
            if(isHidden) {
                icon.style.transform = 'rotate(90deg)';
            } else {
                icon.style.transform = 'rotate(0deg)';
            }
        }

        async function updateStockInline(id, size, newValue) {
            const qty = parseInt(newValue) || 0;
            try {
                await db.collection("products").doc(id).update({
                    [`stock.${size}`]: qty
                });
                showToast("Stock actualizado", "success");
            } catch (e) {
                console.error(e);
                showToast("Error al actualizar stock", "error");
            }
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;
            
            const db = firebase.firestore();
            const id = document.getElementById("productId").value;
            const files = document.getElementById("pImageFile").files;
            
            const teamSelectVal = document.getElementById("pTeamSelect").value;
            let finalTeam = teamSelectVal;
            if(teamSelectVal === 'NUEVO') {
                finalTeam = document.getElementById("pTeamNew").value.trim();
            }
            
            if(!finalTeam) {
                showToast("Por favor seleccioná o creá un equipo.", "error");
                saveBtn.disabled = false;
                return;
            }

            let imagenesGuardadas = [];
            try {
                const currentVal = document.getElementById("pImageUrlCurrent").value;
                if (currentVal) imagenesGuardadas = JSON.parse(currentVal);
            } catch(e) {}

            try {
                if (files.length > 0) {
                    imagenesGuardadas = []; 
                    
                    for (let i = 0; i < files.length; i++) {
                        saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Subiendo ${i+1}/${files.length}...`;
                        
                        const formData = new FormData();
                        formData.append("image", files[i]);
                        
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                        const data = await response.json();
                        
                        if (data.success) { 
                            imagenesGuardadas.push(data.data.url); 
                        } else { 
                            throw new Error("Error al subir la foto " + (i+1)); 
                        }
                    }
                }

                if (imagenesGuardadas.length === 0) imagenesGuardadas.push("logo.jpg");

                saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`;
                
                const productData = {
                    title: document.getElementById("pTitle").value,
                    team: finalTeam,
                    productType: document.getElementById("pProductType").value,
                    isRetro: document.getElementById("pIsRetro").checked,
                    price: Number(document.getElementById("pPrice").value),
                    images: imagenesGuardadas, 
                    description: document.getElementById("pDesc").value,
                    stock: {
                        S: Number(document.getElementById("stockS").value) || 0,
                        M: Number(document.getElementById("stockM").value) || 0,
                        L: Number(document.getElementById("stockL").value) || 0,
                        XL: Number(document.getElementById("stockXL").value) || 0,
                        XXL: Number(document.getElementById("stockXXL").value) || 0
                    }
                };

                if (id) {
                    await db.collection("products").doc(id).update(productData);
                    showToast("Producto actualizado", "success");
                } else {
                    await db.collection("products").add(productData);
                    showToast("¡Producto guardado!", "success");
                }
                
                limpiarFormulario();
                
            } catch (error) {
                showToast("Error: " + error.message, "error");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Guardar en la Nube`;
            }
        }

        function editarProducto(id) {
            const db = firebase.firestore();
            db.collection("products").doc(id).get().then((doc) => {
                if (doc.exists) {
                    const p = doc.data();
                    document.getElementById("productId").value = id;
                    document.getElementById("pTitle").value = p.title;
                    
                    const teamSelect = document.getElementById("pTeamSelect");
                    const newInput = document.getElementById("pTeamNew");
                    
                    let existe = false;
                    for(let i=0; i<teamSelect.options.length; i++) {
                        if(teamSelect.options[i].value === p.team) { existe = true; break; }
                    }
                    
                    if(existe) {
                        teamSelect.value = p.team;
                        newInput.style.display = "none";
                        newInput.required = false;
                        newInput.value = "";
                    } else {
                        teamSelect.value = "NUEVO";
                        newInput.style.display = "block";
                        newInput.required = true;
                        newInput.value = p.team;
                    }

                    document.getElementById("pProductType").value = p.productType || "Camiseta";
                    document.getElementById("pIsRetro").checked = p.isRetro || false;
                    document.getElementById("pPrice").value = p.price;
                    
                    let imgs = p.images || (p.image ? [p.image] : []);
                    document.getElementById("pImageUrlCurrent").value = JSON.stringify(imgs);
                    
                    document.getElementById("pDesc").value = p.description || "";
                    document.getElementById("pImageFile").value = ""; 
                    
                    const preview = document.getElementById("previewContainer");
                    preview.innerHTML = "";
                    if (imgs.length > 0) {
                        const txt = document.createElement("span");
                        txt.className = "txt-existing";
                        txt.innerText = "📸 Fotos actuales guardadas:";
                        preview.appendChild(txt);
                        
                        imgs.forEach(url => {
                            const img = document.createElement("img");
                            img.src = url;
                            img.style.borderColor = "var(--brand-gold)";
                            preview.appendChild(img);
                        });
                    }

                    document.getElementById("stockS").value = p.stock?.S || 0;
                    document.getElementById("stockM").value = p.stock?.M || 0;
                    document.getElementById("stockL").value = p.stock?.L || 0;
                    document.getElementById("stockXL").value = p.stock?.XL || 0;
                    document.getElementById("stockXXL").value = p.stock?.XXL || 0;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        async function eliminarProducto(id) {
            const confirmado = await customConfirm("¿Estás seguro de que querés eliminar este producto? Esta acción no se puede deshacer.");
            if (confirmado) {
                try {
                    await firebase.firestore().collection("products").doc(id).delete();
                    showToast("Producto eliminado", "success");
                } catch (error) {
                    showToast("Error al eliminar el producto", "error");
                }
            }
        }

        function limpiarFormulario() {
            document.getElementById("productForm").reset();
            document.getElementById("productId").value = "";
            document.getElementById("pImageUrlCurrent").value = "";
            document.getElementById("pProductType").value = "Camiseta";
            document.getElementById("pTeamSelect").value = "";
            document.getElementById("pTeamNew").style.display = "none";
            document.getElementById("pTeamNew").required = false;
            document.getElementById("previewContainer").innerHTML = `<span style="color: var(--text-muted); font-size: 13px;">Las fotos seleccionadas aparecerán acá...</span>`;
        }
    </script>
</body>
</html>
