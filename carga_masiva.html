        async function subirTodo() {
            const btn = document.getElementById("btnSubir");
            const status = document.getElementById("status");
            btn.disabled = true;
            
            status.innerText = "Borrando catálogo anterior en la nueva tienda...";
            status.style.color = "#EF4444";
            const querySnapshot = await db.collection("products").get();
            const batch = db.batch();
            querySnapshot.forEach((doc) => {
                batch.delete(doc.ref);
            });
            await batch.commit();

            status.innerText = "Catálogo borrado. Iniciando subida...";
            status.style.color = "#F59E0B";
            
            let completados = 0;
            for (let item of catalogo) {
                const productoFinal = {
                    title: item.title,
                    team: item.team,
                    productType: item.type,
                    isRetro: item.isRetro,
                    price: item.price,
                    images: ["logo.jpg"],
                    description: "",
                    stock: item.stock
                };

                try {
                    await db.collection("products").add(productoFinal);
                    completados++;
                    status.innerText = `Subiendo: ${completados} de ${catalogo.length}...`;
                    await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                    console.error("Error al subir: ", item.title, error);
                }
            }

            status.innerText = "¡Catálogo subido completo! Abre el index o admin para ver los cambios.";
            status.style.color = "#10B981";
            btn.innerText = "Completado";
        }
